
name: Executar etapa

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "Qual etapa deseja executar?"
        required: true
        type: choice
        options:
          - escudos
          - fronteiras
          - dividir_cidades
          - simulacao
          - episodios

permissions:
  contents: write

jobs:
  etapa:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar pastas
        run: |
          mkdir -p data
          mkdir -p escudos

      - name: Executar etapa escolhida
        shell: bash
        env:
          ETAPA: ${{ inputs.etapa }}
        run: |
          set -o pipefail
          echo "Executando etapa: $ETAPA"
          python "src/${ETAPA}.py" 2>&1 | tee etapa_log.txt

      - name: Mostrar resultado no resumo
        if: always()
        shell: bash
        run: |
          echo "## Resultado da execução" >> "$GITHUB_STEP_SUMMARY"
          if [ -f etapa_log.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 etapa_log.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A etapa não chegou a gerar um arquivo de log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Salvar resultados no repositorio
        if: success()
        shell: bash
        env:
          ETAPA: ${{ inputs.etapa }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ escudos/

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova para salvar."
          else
            git commit -m "Atualizar resultados: $ETAPA"
            git push
          fi
