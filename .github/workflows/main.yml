
name: Renderizar episódio 1

on:
  workflow_dispatch:

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Renderizar episódio
        run: python src/renderizar.py

      - name: Salvar vídeo MP4
        uses: actions/upload-artifact@v4
        with:
          name: episodio-1-teste
          path: output/episodio_1_teste.mp4
          if-no-files-found: error
